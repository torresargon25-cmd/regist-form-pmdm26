<div class="container py-5" style="max-width: 600px">
    <h1 class="mb-4">Registro</h1>

    <form>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="nombre">
        </div>

        <div class="mb-3">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="apellidos" name="apellidos" [(ngModel)]="apellidos">
        </div>

        <div class="mb-3">
            <label for="nif" class="form-label">NIF</label>
            <input type="text" class="form-control" id="nif" name="nif" [(ngModel)]="nif">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="email">
        </div>

        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" [(ngModel)]="telefono">
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Sexo</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="hombre" name="sexo" value="Hombre" [(ngModel)]="sexo">
                <label class="form-check-label" for="hombre">Hombre</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" id="mujer" name="sexo" value="Mujer" [(ngModel)]="sexo">
                <label class="form-check-label" for="mujer">Mujer</label>
            </div>
        </div>

        <div class="mb-3">
            <label for="comoConocio" class="form-label">¿Cómo conociste la página?</label>
            <select class="form-select" id="comoConocio" name="comoConocio" [(ngModel)]="comoConocio">
                <option value="">Selecciona una opción</option>
                <option value="Buscando en Google">Buscando en Google</option>
                <option value="A través de un amigo">A través de un amigo</option>
                <option value="Por mi profesor">Por mi profesor</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password">
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                [(ngModel)]="confirmPassword">
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="aceptaTerminos" name="aceptaTerminos"
                [(ngModel)]="aceptaTerminos">
            <label class="form-check-label" for="aceptaTerminos">Acepto los términos y condiciones del registro</label>
        </div>

        <button type="button" class="btn btn-primary" (click)="registrar()">Registro</button>
    </form>
</div>
